name: Build and Test
env:
  RUSTFLAGS: -Dwarnings
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
  push:
    branches:
      - main
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with: 
          toolchain: stable, nightly
          components: clippy, rustfmt
      - name: Cargo Test
        run: cargo test --all-features --workspace
