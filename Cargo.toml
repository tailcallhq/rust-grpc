[package]
name = "rust-grpc"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.6"
tonic-reflection = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14.4"
anyhow = "1.0.104"
tonic-tracing-opentelemetry = "0.42.1"
opentelemetry = { version = "0.33", features = ["trace"] }
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
  "trace", "grpc-tonic", "tls-roots", "tls-ring",
] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Subscriber selection is handled by the application below.
shuttle-runtime = { version = "0.57", default-features = false }
async-trait = "0.1.92"

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
gh-workflow = "0.9"
