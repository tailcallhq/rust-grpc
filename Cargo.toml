[package]
name = "rust-grpc"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
anyhow = "1.0.104"
tonic-tracing-opentelemetry = "0.38.0"
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = [
  "trace",
  "grpc-tonic",
  "tls-ring",
  "tls-roots",
] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = "0.3.23"
shuttle-runtime = "0.57.0"

[build-dependencies]
tonic-prost-build = "0.14.6"
protoc-bin-vendored = "3.2.0"

[dev-dependencies]
gh-workflow = "0.9.0"
