[package]
name = "rust-grpc"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hyper = { version = "1.12.0", features = ["full"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-reflection = "0.14.9"
prost = "0.14.4"
prost-types = "0.14.4"
tower = "0.5.3"
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
anyhow = "1.0.104"
once_cell = "1.21.4"
tonic-tracing-opentelemetry = "0.42.1"
opentelemetry = { version = "0.33.1", features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", features = ["trace", "rt-tokio"] }
opentelemetry-semantic-conventions = "0.33.1"
opentelemetry-http = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
  "trace",
  "grpc-tonic",
  # required to make grpc requests
  "tls-roots",
  "tls-ring",
] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
shuttle-runtime = "0.57.0"
shuttle-axum = "0.57.0"
async-trait = "0.1.92"

[build-dependencies]
gh-workflow = "0.9.0"
tonic-build = "0.14.9"
tonic-prost-build = "0.14.9"

[dev-dependencies]
gh-workflow = "0.9.0"
