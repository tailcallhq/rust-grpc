[package]
name = "rust-grpc"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.5"
http = "1.3.2"
anyhow = "1.0.104"
once_cell = "1.21.4"
tonic-tracing-opentelemetry = "0.38.0"
opentelemetry = { version = "0.32.0", features = [
  "trace",
] }
opentelemetry_sdk = { version = "0.32.1", features = [
  "trace",
  "rt-tokio",
] }
opentelemetry-semantic-conventions = "0.32.1"
opentelemetry-http = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = [
  "trace",
  "grpc-tonic",
  # required to make grpc requests
  "tls-roots",
] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = "0.3.23"
shuttle-runtime = "0.57.0"
shuttle-axum = "0.57.0"
async-trait = "0.1.92"

[build-dependencies]
gh-workflow = "0.9.0"
tonic-build = "0.14.6"
tonic-prost-build = "0.14.6"

[dev-dependencies]
gh-workflow = "0.9.0"
