[package]
name = "rust-grpc"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.43.0", features = ["full"] }
tonic = "0.12.3"
tonic-reflection = "0.12.3"
prost = "0.13.4"
prost-types = "0.13.4"
anyhow = "1.0.95"
once_cell = "1.20.2"
tonic-tracing-opentelemetry = "0.23.0"
opentelemetry = { version = "0.27.1", features = ["trace"] }
opentelemetry_sdk = { version = "0.27.1", features = ["trace"] }
opentelemetry-semantic-conventions = "0.27.0"
opentelemetry-otlp = { version = "0.27.0", features = [
  "grpc-tonic",
  "trace",
  # required to make grpc requests
  "tls-roots",
] }
tracing = "0.1.41"
tracing-opentelemetry = "0.28.0"
tracing-subscriber = "0.3.19"
shuttle-runtime = "0.49.0"
shuttle-axum = "0.39.0"
async-trait = "0.1.83"

[build-dependencies]
gh-workflow = "0.5.3"
tonic-build = "0.12.3"

[dev-dependencies]
gh-workflow = "0.5.3"
