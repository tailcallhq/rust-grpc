[package]
name = "rust-grpc"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
prost = "0.14.4"
anyhow = "1.0.104"
once_cell = "1.21.4"
tonic-tracing-opentelemetry = "0.38.0"
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace"] }
opentelemetry-semantic-conventions = "0.32.1"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "grpc-tonic", "tls-ring", "tls-roots"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = "0.3.23"
shuttle-runtime = { version = "0.57.0", default-features = false }
async-trait = "0.1.92"

[build-dependencies]
tonic-prost-build = "0.14.6"
protoc-bin-vendored = "3.2.0"

[dev-dependencies]
gh-workflow = "0.9.0"
