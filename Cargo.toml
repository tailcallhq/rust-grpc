[package]
name = "rust-grpc"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.53", features = ["full"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
anyhow = "1.0.104"
once_cell = "1.21.4"
tonic-tracing-opentelemetry = "0.42.1"
opentelemetry = { version = "0.33.1", features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", features = ["trace", "rt-tokio"] }
opentelemetry-semantic-conventions = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", features = [
  "trace",
  "grpc-tonic",
  # required to make grpc requests
  "tls-roots",
  "tls-ring",
] }
tracing = "0.1.41"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = "0.3.20"
shuttle-runtime = "0.57.0"
async-trait = "0.1.92"

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
gh-workflow = "0.5.1"
