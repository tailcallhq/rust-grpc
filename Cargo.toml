[package]
name = "grpc-rust"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
prost = "0.12"
prost-types = "0.12"
tonic = "0.11"
tonic-build = "0.11"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread"] }
async-stream = "0.3"
futures-core = "0.3"
